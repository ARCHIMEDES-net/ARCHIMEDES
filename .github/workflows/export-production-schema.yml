name: Export production schema

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-production-schema
  cancel-in-progress: false

jobs:
  export:
    name: Create schema-only artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: gipikahmjlcynkqexxmz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "Missing repository secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "Missing repository secret: SUPABASE_DB_PASSWORD" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Link production project read-only for export
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "${PROJECT_ID}" --password "${SUPABASE_DB_PASSWORD}"

      - name: Export public schema without data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # `supabase db dump` is schema-only by default unless --data-only
          # or --role-only is explicitly supplied.
          supabase db dump \
            --linked \
            --schema public \
            --file artifacts/production-public-schema.sql \
            --password "${SUPABASE_DB_PASSWORD}"
          sha256sum artifacts/production-public-schema.sql \
            > artifacts/production-public-schema.sql.sha256
          test -s artifacts/production-public-schema.sql

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-public-schema-${{ github.run_id }}
          path: |
            artifacts/production-public-schema.sql
            artifacts/production-public-schema.sql.sha256
          if-no-files-found: error
          retention-days: 7
