name: Controlled onboarding E2E for PR 197 via OIDC

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  id-token: write

concurrency:
  group: controlled-onboarding-e2e-pr197-oidc
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.pull_request.number == 197 &&
      github.event.pull_request.head.repo.full_name == 'ARCHIMEDES-net/ARCHIMEDES' &&
      github.event.pull_request.head.ref == 'agent/unified-registration-email-provider' &&
      github.event.pull_request.base.ref == 'main' &&
      github.run_attempt == 1
    name: Allowlisted internal onboarding email
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      NEXT_TELEMETRY_DISABLED: "1"
      ONBOARDING_E2E_SITE_URL: https://archimedes-5ai5-git-agent-unifi-84fa0e-antonin-kopliks-projects.vercel.app
      ONBOARDING_E2E_OIDC_AUDIENCE: archimedes-onboarding-e2e-pr197
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build production application
        run: npm run build

      - name: Wait for the matching Preview endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "${ONBOARDING_E2E_SITE_URL}/api/admin/oidc-onboarding-e2e" || true)"
            if [ "${status}" = "405" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "The matching Preview endpoint did not become ready." >&2
          exit 1

      - name: Run the single approved OIDC E2E
        shell: bash
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail-with-body --silent --show-error --get \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${ONBOARDING_E2E_OIDC_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_token="$(printf '%s' "${oidc_response}" | node -e \
            'let data="";process.stdin.on("data",c=>data+=c);process.stdin.on("end",()=>{const value=JSON.parse(data).value;if(typeof value!=="string"||value.split(".").length!==3)process.exit(1);process.stdout.write(value)})')"
          unset oidc_response
          result="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${oidc_token}" \
            --header "Content-Type: application/json" \
            "${ONBOARDING_E2E_SITE_URL}/api/admin/oidc-onboarding-e2e")"
          unset oidc_token
          printf '%s\n' "${result}"
          printf '%s' "${result}" | node -e \
            'let data="";process.stdin.on("data",c=>data+=c);process.stdin.on("end",()=>{const r=JSON.parse(data);if(r.ok!==true||r.status!=="cleaned"||typeof r.runId!=="string")process.exit(1)})'
